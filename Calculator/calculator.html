<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="description" content="Calculator Project">
	<meta name="keywords" content="JS Calculator">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<title>Calculator</title>

	<!-- external CSS link -->
	<link rel="stylesheet" href="calculator.css">
</head>

<body>
	<main>
		<section class="calculator">
			<div class="screen" aria-live="polite">
				<input type="text" value="0" readonly>
			</div>
			<div class="calculator-buttons">
				<div class="operator">
					<button type="button" value="AC" class="clear">AC</button>
					<button aria-label="Backspace" type="button" value="delete" class="clear">⌫</button>
				</div>
				<div class="keys">
					<button type="button" value="7">7</button>
					<button type="button" value="8">8</button>	
					<button type="button" value="9">9</button>
					<button type="button" value="/">&divide;</button>

					<button type="button" value="4">4</button>
					<button type="button" value="5">5</button>
					<button type="button" value="6">6</button>
					<button type="button" value="*">&times;</button>

					<button type="button" value="1">1</button>
					<button type="button" value="2">2</button>
					<button type="button" value="3">3</button>
					<button type="button" value="+">+</button>

					<button type="button" value="0">0</button>
					<button type="button" value=".">.</button>
					<button type="button" value="=">=</button>
					<button type="button" value="-">&minus;</button>
				</div>
			</div>	
		</section>
	</main> 





	<script type="text/javascript" src="calculator.js"></script>
</body>

</html>
